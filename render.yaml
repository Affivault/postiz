# Render Blueprint: private, single-user Postiz.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Uses the image built from this repo by the "Deploy Private Instance"
# GitHub Action (ghcr.io/affivault/postiz). Only the first account can sign up.
services:
  - type: web
    name: postiz
    runtime: image
    image:
      url: ghcr.io/affivault/postiz:latest
    plan: standard
    # Point the app at its own onrender.com address, then start it as usual.
    # PORT=5000 tells Render where nginx listens; the backend itself stays on 3000.
    dockerCommand: >-
      /bin/sh -c 'export PORT=3000 MAIN_URL="$RENDER_EXTERNAL_URL"
      FRONTEND_URL="$RENDER_EXTERNAL_URL"
      NEXT_PUBLIC_BACKEND_URL="$RENDER_EXTERNAL_URL/api"
      && cd /app && nginx && pnpm run pm2'
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 2
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: postiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: postiz-redis
          property: connectionString
      - key: TEMPORAL_ADDRESS
        fromService:
          type: pserv
          name: postiz-temporal
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_INTERNAL_URL
        value: http://localhost:3000
      - key: IS_GENERAL
        value: 'true'
      - key: DISABLE_REGISTRATION
        value: 'true'
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIRECTORY
        value: /uploads
      - key: NEXT_PUBLIC_UPLOAD_DIRECTORY
        value: /uploads

  - type: pserv
    name: postiz-temporal
    runtime: image
    image:
      url: docker.io/temporalio/auto-setup:1.28.1
    plan: starter
    envVars:
      - key: PORT
        value: 7233
      - key: DB
        value: postgres12
      - key: DB_PORT
        value: 5432
      - key: POSTGRES_SEEDS
        fromDatabase:
          name: postiz-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: postiz-db
          property: user
      - key: POSTGRES_PWD
        fromDatabase:
          name: postiz-db
          property: password
      - key: ENABLE_ES
        value: 'false'

  - type: keyvalue
    name: postiz-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: postiz-db
    plan: basic-256mb
    databaseName: postiz
    user: postiz
