# Render Blueprint: Acre Social.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Uses the image built from this repo by the "Build and Deploy"
# GitHub Action (ghcr.io/affivault/postiz). See deploy/render/README.md.
#
# - App data lives in Supabase (DATABASE_URL, asked for on first apply)
# - Temporal (post scheduling) runs here with its own small Render Postgres
# - Media is stored in Cloudflare R2
services:
  - type: web
    name: acre-social
    runtime: image
    image:
      url: ghcr.io/affivault/postiz:latest
    plan: standard
    # Use FRONTEND_URL when a custom domain is set, otherwise the onrender.com
    # address. PORT=5000 tells Render where nginx listens; the backend itself
    # stays on 3000.
    dockerCommand: >-
      /bin/sh -c 'URL="${FRONTEND_URL:-$RENDER_EXTERNAL_URL}"
      && export PORT=3000 MAIN_URL="$URL" FRONTEND_URL="$URL"
      NEXT_PUBLIC_BACKEND_URL="$URL/api"
      && cd /app && nginx && pnpm run pm2'
    envVars:
      - key: PORT
        value: 5000
      # Supabase -> Connect -> Session pooler connection string
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: acre-redis
          property: connectionString
      - key: TEMPORAL_ADDRESS
        fromService:
          type: pserv
          name: acre-temporal
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_INTERNAL_URL
        value: http://localhost:3000
      - key: IS_GENERAL
        value: 'true'
      - key: STORAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKETNAME
        sync: false
      # Public URL of the bucket (r2.dev or custom domain), no trailing slash
      - key: CLOUDFLARE_BUCKET_URL
        sync: false
      - key: CLOUDFLARE_REGION
        value: auto
      # Optional: Sentry error monitoring
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

  - type: pserv
    name: acre-temporal
    runtime: image
    image:
      url: docker.io/temporalio/auto-setup:1.28.1
    plan: starter
    envVars:
      - key: PORT
        value: 7233
      - key: DB
        value: postgres12
      - key: DB_PORT
        value: 5432
      - key: POSTGRES_SEEDS
        fromDatabase:
          name: acre-temporal-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: acre-temporal-db
          property: user
      - key: POSTGRES_PWD
        fromDatabase:
          name: acre-temporal-db
          property: password
      - key: ENABLE_ES
        value: 'false'

  - type: keyvalue
    name: acre-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: acre-temporal-db
    plan: basic-256mb
    databaseName: temporal
    user: temporal
