---
name: "Deploy Private Instance"

# Builds this repo into a Docker image on every push to main, then redeploys
# Render (render.yaml) and/or the server set up with deploy/private/setup.sh.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-private
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner != 'gitroomhq'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret is not set, image built but not deployed. See deploy/private/README.md"

      - name: Checkout
        if: env.DEPLOY_HOST != ''
        uses: actions/checkout@v4

      - name: Deploy
        if: env.DEPLOY_HOST != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST"

          $SSH 'mkdir -p /opt/postiz/dynamicconfig'
          scp -i ~/.ssh/deploy_key deploy/private/docker-compose.yaml deploy/private/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/postiz/"
          scp -i ~/.ssh/deploy_key dynamicconfig/development-sql.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/postiz/dynamicconfig/"

          # Short-lived token, only used for this pull
          echo "${{ github.token }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "cd /opt/postiz \
            && sed -i '/^POSTIZ_IMAGE=/d' .env \
            && echo 'POSTIZ_IMAGE=$IMAGE' >> .env \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -af \
            && docker logout ghcr.io"
